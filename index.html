
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tabela Periódica</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ESTRELAS DO MODO ESCURO -->
  <div class="estrelas"></div>

  <!-- TÍTULO -->
  <h1>Tabela Periódica</h1>

  <div class="linha"></div>

  <!-- PESQUISA E VISUALIZAÇÃO -->
  <div class="busca-resultado">

    <!-- ÁREA DE PESQUISA -->
    <div class="area-pesquisa">

      <div class="input-wrapper">

        <input
          type="text"
          id="busca"
          placeholder="Qual elemento você procura?"
          autocomplete="off"
        />

        <div
          id="sugestoes"
          class="sugestoes">
        </div>

      </div>

      <button onclick="buscarElemento()">
        Buscar
      </button>

    </div>

    <!-- VISUALIZAÇÃO DO ELEMENTO -->
    <div class="visualizacao-elemento">

      <!-- INFORMAÇÕES PRINCIPAIS À ESQUERDA -->
      <div id="resultado"></div>

      <!-- MODELO DO ÁTOMO -->
      <div id="atomo"></div>

    </div>

  </div>

  <!-- MENU DE CONFIGURAÇÕES -->
  <div class="menu-container">

    <button id="menu-btn">
      ⋮
    </button>

    <div id="menu" class="hidden">

      <label class="dark-toggle">

        <span class="toggle-text">
          Modo escuro
        </span>

        <input
          type="checkbox"
          id="darkToggle"
        />

        <span class="toggle-slider">

          <span class="toggle-circle">

            <span class="sol">☀️</span>
            <span class="lua">🌙</span>

          </span>

        </span>

      </label>

    </div>

  </div>

  <!-- BOTÕES SUPERIORES -->
  <div class="botoes-superiores">

    <!-- CURIOSIDADES -->
    <button
      id="curiosidade-btn"
      class="botao-superior"
      aria-label="Curiosidade química"
      title="Curiosidade química"
    >

      <span class="icone-curiosidade">
        ✦
      </span>

    </button>

    <!-- FAVORITOS -->
    <button
      id="favoritos-btn"
      class="botao-superior"
      aria-label="Favoritos"
      title="Favoritos"
    >

      <span class="icone-favoritos">
        ☆
      </span>

    </button>

  </div>

  <!-- PAINEL DE CURIOSIDADES -->
  <div
    id="painel-curiosidade"
    class="painel-superior hidden"
  >

    <h3>✨ Curiosidade química</h3>

    <p id="texto-curiosidade"></p>

    <button id="outra-curiosidade">
      Outra curiosidade
    </button>

  </div>

  <!-- PAINEL DE FAVORITOS -->
  <div
    id="painel-favoritos"
    class="painel-superior hidden"
  >

    <h3>☆ Meus favoritos</h3>

    <p id="aviso-favoritos">
      Pesquise um elemento e salve-o nos favoritos.
    </p>

    <button
      id="salvar-atual"
      class="salvar-atual"
    >
      ☆ Salvar elemento atual
    </button>

    <div id="lista-favoritos"></div>

  </div>

  <!-- ================================================= -->
  <!-- JANELA DE MAIS DETALHES -->
  <!-- ================================================= -->

  <div
    id="modal-detalhes"
    class="detalhes-modal hidden"
  >

    <div class="detalhes-conteudo">

      <!-- BOTÃO FECHAR -->
      <button
        id="fechar-detalhes"
        class="fechar-detalhes"
        aria-label="Fechar detalhes"
        title="Fechar"
      >
        ✕
      </button>

      <!-- NOME DO ELEMENTO -->
      <h2 id="detalhe-nome">
        Elemento
      </h2>

      <!-- SÍMBOLO QUÍMICO -->
      <div
        class="detalhe-simbolo"
        id="detalhe-simbolo"
      >
        --
      </div>

      <!-- INFORMAÇÕES PRINCIPAIS -->
      <div class="detalhes-grade">

        <div class="detalhe-card">

          <span>
            Número atômico
          </span>

          <strong id="detalhe-numero">
            --
          </strong>

        </div>

        <div class="detalhe-card">

          <span>
            Massa atômica
          </span>

          <strong id="detalhe-massa">
            --
          </strong>

        </div>

        <div class="detalhe-card">

          <span>
            Prótons
          </span>

          <strong id="detalhe-protons">
            --
          </strong>

        </div>

        <div class="detalhe-card">

          <span>
             Classificação
            </span>

           <strong id="detalhe-eletrons">
              --
            </strong>

        </div>

      </div>

      <!-- ESPAÇO PARA FUTURAS INFORMAÇÕES -->
      <div class="detalhes-futuro">

        <h3>
          Outras informações
        </h3>

        <p>
          Novas informações químicas serão adicionadas aqui.
        </p>

      </div>

    </div>

  </div>

  <!-- JAVASCRIPT -->
  <script src="dados-elementos.js"></script>
  <script src="script.js"></script>

</body>
</html>
